[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amiaffected"
version = "0.1.1"
description = "Local, read-only checks of this machine against curated security incident advisories."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
amiaffected = "amiaffected.__main__:main"

[tool.setuptools]
packages = ["amiaffected", "amiaffected.rules"]
