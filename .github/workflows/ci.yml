name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: validate advisories and fixtures
        run: python -m amiaffected validate
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: live check on the runner (exit 0, 1 or 2 are all valid outcomes)
        run: python -m amiaffected check; test $? -le 2
